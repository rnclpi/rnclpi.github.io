<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris Cute Warm</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(to bottom right, #ffd6d6, #ffb347);
      font-family: 'Arial Rounded MT Bold', sans-serif;
    }
    .container {
      display: flex;
      gap: 20px;
      background: #fff3e6;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    canvas {
      background: #ffe5cc;
      border: 3px solid #ff9999;
      border-radius: 10px;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 10px;
      background: #fff0f5;
      border-radius: 15px;
      min-width: 150px;
      text-align: center;
      color: #ff6666;
      font-weight: bold;
    }
    .sidebar h2 {
      margin: 10px 0;
      font-size: 1.2em;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      background: #ff9999;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <canvas id="tetris" width="240" height="400"></canvas>
    <div class="sidebar">
      <h2>Next</h2>
      <canvas id="next" width="80" height="80"></canvas>
      <h2>Score</h2>
      <div id="score">0</div>
      <h2>Level</h2>
      <div id="level">1</div>
      <div class="controls">
        <button class="btn" onclick="move(-1)">◀</button>
        <button class="btn" onclick="rotate()">⟳</button>
        <button class="btn" onclick="move(1)">▶</button>
        <button class="btn" onclick="drop()">▼</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');
    nextCtx.scale(20, 20);

    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length -1; y >=0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        player.score += rowCount * 10;
        rowCount *= 2;
      }
    }

    function collide(arena, player) {
      const m = player.matrix;
      const o = player.pos;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
              (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    function createPiece(type) {
      if (type === 'T') {
        return [
          [0,0,0],
          [1,1,1],
          [0,1,0],
        ];
      } else if (type === 'O') {
        return [
          [2,2],
          [2,2],
        ];
      } else if (type === 'L') {
        return [
          [0,3,0],
          [0,3,0],
          [0,3,3],
        ];
      } else if (type === 'J') {
        return [
          [0,4,0],
          [0,4,0],
          [4,4,0],
        ];
      } else if (type === 'I') {
        return [
          [0,5,0,0],
          [0,5,0,0],
          [0,5,0,0],
          [0,5,0,0],
        ];
      } else if (type === 'S') {
        return [
          [0,6,6],
          [6,6,0],
          [0,0,0],
        ];
      } else if (type === 'Z') {
        return [
          [7,7,0],
          [0,7,7],
          [0,0,0],
        ];
      }
    }

    function drawMatrix(matrix, offset, ctx = context) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            ctx.fillStyle = colors[value];
            ctx.fillRect(x + offset.x,
                         y + offset.y,
                         1, 1);
          }
        });
      });
    }

    function draw() {
      context.fillStyle = '#ffe5cc';
      context.fillRect(0, 0, canvas.width, canvas.height);
      drawMatrix(arena, {x:0, y:0});
      drawMatrix(player.matrix, player.pos);
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
      }
      dropCounter = 0;
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    function playerReset() {
      const pieces = 'TJLOSZI';
      player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) -
                     (player.matrix[0].length / 2 | 0);
      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        updateScore();
      }
    }

    function playerRotate() {
      const m = player.matrix;
      const N = m.length;
      const result = m.map((row, i) => row.map((_, j) => m[N - j - 1][i]));
      player.matrix = result;
      if (collide(arena, player)) {
        player.matrix = m; // revert if collision after rotate
      }
    }

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;
      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }
      draw();
      requestAnimationFrame(update);
    }

    function updateScore() {
      document.getElementById('score').innerText = player.score;
    }

    const colors = [
      null,
      '#ff6666',
      '#ffcc66',
      '#ff9966',
      '#ff99cc',
      '#ffcc99',
      '#ff6699',
      '#ffb347',
    ];

    const arena = createMatrix(12, 20);

    const player = {
      pos: {x:0, y:0},
      matrix: null,
      score: 0
    };

    document.addEventListener('keydown', event => {
      if (event.keyCode === 37) {
        playerMove(-1);
      } else if (event.keyCode === 39) {
        playerMove(1);
      } else if (event.keyCode === 40) {
        playerDrop();
      } else if (event.keyCode === 38) {
        playerRotate();
      }
    });

    function move(dir){ playerMove(dir); }
    function rotate(){ playerRotate(); }
    function drop(){ playerDrop(); }

    playerReset();
    updateScore();
    update();
  </script>
</body>
</html>
</html>
